title: Kynigoi Blog
description: Security Engineering Blog.
author: kynigoi

url: "https://unresolvedhost.github.io"
baseurl: "/kynigoi-blog-theme"

timezone: Australia/Perth
lang: en

favicon:
  ico:             /assets/img/favicons/favicon.svg
  apple_touch_icon: /assets/img/favicons/favicon.svg
  favicon_32:      /assets/img/favicons/favicon.svg
  favicon_16:      /assets/img/favicons/favicon.svg

social:
  email: richardphilipsroy@gmail.com
  linkedin: richardphilipsroy
  github: unresolvedhost
  x: unresolvedhost

github_username: unresolvedhost

permalink: /posts/:title/

paginate: 10
paginate_path: "/page/:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

sass:
  sass_dir: _sass
  style: compressed
  load_paths:
    - _sass

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

collections:
  pages:
    output: true
    permalink: /categories/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules