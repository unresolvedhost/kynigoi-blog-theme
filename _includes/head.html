<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ page.description | default: site.description }}">

<title>
  {% if page.title %}{{ page.title }} &mdash; {{ site.title }}
  {% else %}{{ site.title }}{% endif %}
</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicons/favicon.svg' | prepend: site.baseurl }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicons/favicon.svg' | prepend: site.baseurl }}">

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | prepend: site.baseurl }}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600&display=swap" rel="stylesheet">

{% seo %}
{% feed_meta %}
